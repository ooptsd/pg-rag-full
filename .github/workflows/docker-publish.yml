name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pg-rag-full:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pg-rag-full:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pg-rag-full:${{ steps.version.outputs.VERSION }}-amd64
            ${{ secrets.DOCKERHUB_USERNAME }}/pg-rag-full:${{ steps.version.outputs.VERSION }}-arm64
            ghcr.io/${{ github.repository }}/pg-rag-full:latest
            ghcr.io/${{ github.repository }}/pg-rag-full:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/pg-rag-full:${{ steps.version.outputs.VERSION }}-amd64
            ghcr.io/${{ github.repository }}/pg-rag-full:${{ steps.version.outputs.VERSION }}-arm64